<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Комната Сновидений — Архив</title>

<style>
:root{
    --bg:#05070d;
    --blue:#718dbd;
    --blue2:#a9c8ef;
    --violet:#806da8;
    --gold:#c6a66a;
    --text:#d8d9df;
    --muted:#626a79;
}

*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#05070d;
    color:var(--text);
    font-family:Georgia,"Times New Roman",serif;
}

body{
    overflow:hidden;
}

button{
    font:inherit;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 45%,
            rgba(88,108,165,.12),
            transparent 22%),
        radial-gradient(circle at 50% 100%,
            rgba(95,65,125,.14),
            transparent 42%),
        linear-gradient(#05070d,#080a13);
}

/* STARS */

.stars{
    position:absolute;
    inset:0;
    opacity:.55;
    background-image:
        radial-gradient(circle,rgba(210,220,255,.7) 0 1px,transparent 1px);
    background-size:91px 103px;
    animation:stars 35s linear infinite;
}

@keyframes stars{
    to{transform:translate(-50px,35px)}
}

/* HEADER */

.header{
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:76px;
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    border-bottom:1px solid rgba(130,150,200,.12);
    background:rgba(5,7,13,.65);
    backdrop-filter:blur(12px);
}

.back{
    color:#737c8e;
    text-decoration:none;
    display:flex;
    align-items:center;
    gap:12px;
    font-size:9px;
    letter-spacing:2px;
    transition:.3s;
}

.back:hover{
    color:var(--blue2);
}

.back strong{
    color:#9b7f51;
    font-size:17px;
    font-weight:normal;
}

.room-name{
    text-align:right;
}

.room-name small{
    display:block;
    color:#53627b;
    font-size:8px;
    letter-spacing:3px;
}

.room-name b{
    display:block;
    margin-top:5px;
    color:#b8c3d7;
    font-size:12px;
    font-weight:normal;
    letter-spacing:2px;
}

/* CENTER */

.center{
    position:absolute;
    left:50%;
    top:50%;
    width:500px;
    height:500px;
    transform:translate(-50%,-48%);
}

/* DREAM MOON */

.moon{
    position:absolute;
    left:50%;
    top:45px;
    width:145px;
    height:145px;
    transform:translateX(-50%);
    border-radius:50%;
    border:1px solid rgba(180,200,240,.25);
    background:
        radial-gradient(circle at 35% 30%,
            rgba(225,235,255,.25),
            rgba(80,105,155,.12) 48%,
            transparent 72%);
    box-shadow:
        0 0 45px rgba(120,150,210,.13),
        0 0 100px rgba(100,120,190,.08);
    cursor:pointer;
    transition:.5s;
}

.moon:hover{
    transform:translateX(-50%) scale(1.08);
    box-shadow:
        0 0 70px rgba(140,170,230,.25),
        0 0 150px rgba(100,120,200,.12);
}

.moon:after{
    content:"";
    position:absolute;
    width:25px;
    height:25px;
    left:35px;
    top:33px;
    border-radius:50%;
    background:rgba(25,32,50,.4);
    box-shadow:
        40px 38px 0 -7px rgba(30,38,58,.35),
        15px 62px 0 -10px rgba(30,38,58,.4);
}

.moon-symbol{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    color:#d9e7ff;
    font-size:33px;
    text-shadow:0 0 25px #b9d4ff;
}

/* RINGS */

.ring{
    position:absolute;
    left:50%;
    top:50%;
    border:1px solid rgba(115,145,200,.13);
    border-radius:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
}

.r1{
    width:260px;
    height:260px;
    animation:spin 25s linear infinite;
}

.r2{
    width:370px;
    height:370px;
    border-style:dashed;
    animation:spinReverse 38s linear infinite;
}

.r3{
    width:470px;
    height:470px;
    opacity:.45;
    animation:spin 55s linear infinite;
}

@keyframes spin{
    to{transform:translate(-50%,-50%) rotate(360deg)}
}

@keyframes spinReverse{
    to{transform:translate(-50%,-50%) rotate(-360deg)}
}

/* SIGNS */

.sign{
    position:absolute;
    width:70px;
    height:70px;
    border:1px solid rgba(120,150,205,.18);
    background:rgba(8,12,22,.72);
    color:#8095ba;
    cursor:pointer;
    transition:.35s;
    z-index:10;
}

.sign:hover{
    color:#d2e2ff;
    border-color:rgba(160,190,240,.5);
    box-shadow:0 0 35px rgba(110,150,220,.14);
    transform:scale(1.08);
}

.sign span{
    font-size:22px;
}

.sign small{
    display:block;
    margin-top:5px;
    font-size:6px;
    letter-spacing:1px;
    color:#57637a;
}

.sign:nth-of-type(1){
    left:-5px;
    top:190px;
}

.sign:nth-of-type(2){
    right:-5px;
    top:190px;
}

.sign:nth-of-type(3){
    left:50%;
    bottom:-15px;
    transform:translateX(-50%);
}

.sign:nth-of-type(3):hover{
    transform:translateX(-50%) scale(1.08);
}

/* DREAMER */

.dreamer{
    position:absolute;
    left:50%;
    bottom:28px;
    width:90px;
    height:145px;
    transform:translateX(-50%);
    z-index:12;
    pointer-events:none;
}

.dreamer-aura{
    position:absolute;
    inset:-50px;
    border-radius:50%;
    background:radial-gradient(circle,
        rgba(112,143,202,.18),
        transparent 65%);
    filter:blur(16px);
    animation:aura 4s ease-in-out infinite;
}

@keyframes aura{
    0%,100%{transform:scale(.9);opacity:.55}
    50%{transform:scale(1.1);opacity:1}
}

.dreamer-head{
    position:absolute;
    top:5px;
    left:50%;
    width:34px;
    height:34px;
    transform:translateX(-50%);
    border-radius:50%;
    background:
        radial-gradient(circle at 50% 45%,
        #d6e2f2 0 2px,
        #687b9a 4px,
        #161d2a 54%,
        transparent 72%);
    box-shadow:0 0 25px rgba(150,180,225,.3);
}

.dreamer-body{
    position:absolute;
    bottom:0;
    left:50%;
    width:65px;
    height:100px;
    transform:translateX(-50%);
    border-radius:35px 35px 5px 5px;
    background:
        linear-gradient(90deg,
        transparent,
        rgba(120,155,210,.12),
        transparent);
    border:1px solid rgba(130,160,210,.1);
}

.dreamer-rune{
    position:absolute;
    left:50%;
    top:52px;
    transform:translateX(-50%);
    color:#b5d2fa;
    font-size:21px;
    text-shadow:0 0 20px #a7c9fa;
}

/* MESSAGE */

.message{
    position:absolute;
    left:50%;
    top:195px;
    width:390px;
    transform:translateX(-50%);
    text-align:center;
    z-index:20;
    opacity:0;
    pointer-events:none;
    transition:.5s;
}

.message.show{
    opacity:1;
}

.message p{
    margin:0;
    color:#c6cfdf;
    font-size:13px;
    line-height:1.8;
    text-shadow:0 2px 15px #000;
}

.message small{
    display:block;
    margin-top:9px;
    color:#5f708e;
    font-size:7px;
    letter-spacing:3px;
}

/* TITLE */

.title{
    position:absolute;
    left:50%;
    top:100px;
    transform:translateX(-50%);
    text-align:center;
    z-index:5;
    pointer-events:none;
}

.title small{
    color:#596b88;
    font-size:8px;
    letter-spacing:4px;
}

.title h1{
    margin:8px 0 0;
    font-weight:normal;
    color:#c9d0dd;
    font-size:28px;
}

/* DISCOVERY */

.discovery{
    position:absolute;
    left:50%;
    bottom:28px;
    transform:translateX(-50%);
    z-index:40;
    padding:11px 18px;
    border:1px solid rgba(120,150,210,.25);
    background:rgba(8,12,20,.8);
    color:#91a9d0;
    cursor:pointer;
    font-size:8px;
    letter-spacing:2px;
    transition:.3s;
}

.discovery:hover{
    color:#d9e8ff;
    border-color:rgba(170,200,240,.55);
}

/* JOURNAL */

.journal{
    position:absolute;
    right:25px;
    bottom:25px;
    width:210px;
    padding:17px;
    z-index:35;
    border:1px solid rgba(120,145,190,.13);
    background:rgba(7,10,17,.72);
    backdrop-filter:blur(10px);
}

.journal small{
    color:#52627e;
    font-size:7px;
    letter-spacing:2px;
}

.journal h3{
    margin:8px 0;
    color:#aebbd0;
    font-size:12px;
    font-weight:normal;
}

.journal p{
    margin:0;
    color:#5f6775;
    font-size:9px;
    line-height:1.6;
}

.journal-progress{
    height:2px;
    background:#161d28;
    margin-top:12px;
}

.journal-progress span{
    display:block;
    height:100%;
    width:0;
    background:#7e9dca;
    transition:.5s;
}

/* INVENTORY */

.fragments{
    position:absolute;
    left:25px;
    bottom:25px;
    z-index:35;
}

.fragments small{
    display:block;
    color:#52627e;
    font-size:7px;
    letter-spacing:2px;
}

.fragment-count{
    margin-top:7px;
    color:#b7c9e7;
    font-size:14px;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(2,4,8,.82);
    backdrop-filter:blur(15px);
}

.modal.open{
    display:flex;
}

.modal-card{
    width:min(600px,100%);
    padding:38px;
    position:relative;
    border:1px solid rgba(125,155,210,.24);
    background:
        radial-gradient(circle at 50% 0,
        rgba(100,130,190,.09),
        transparent 40%),
        #0b1019;
    box-shadow:0 35px 100px #000;
}

.modal-close{
    position:absolute;
    right:15px;
    top:10px;
    border:0;
    background:none;
    color:#697486;
    font-size:23px;
    cursor:pointer;
}

.modal-kicker{
    color:#62799f;
    font-size:8px;
    letter-spacing:3px;
}

.modal h2{
    margin:13px 0 15px;
    color:#d2d9e5;
    font-weight:normal;
}

.modal p{
    color:#929aa9;
    font-size:12px;
    line-height:1.9;
}

.modal-button{
    margin-top:18px;
    padding:11px 16px;
    border:1px solid rgba(125,155,210,.25);
    background:rgba(100,130,190,.05);
    color:#a9c4ea;
    cursor:pointer;
    font-size:9px;
    letter-spacing:1px;
}

/* RESPONSIVE */

@media(max-width:800px){

    .center{
        transform:translate(-50%,-45%) scale(.75);
    }

    .journal{
        right:12px;
        bottom:12px;
        width:175px;
    }

    .fragments{
        left:12px;
        bottom:12px;
    }

    .title h1{
        font-size:23px;
    }
}

@media(max-width:560px){

    .center{
        transform:translate(-50%,-42%) scale(.58);
    }

    .journal{
        display:none;
    }

    .header{
        padding:0 15px;
    }

    .room-name{
        display:none;
    }
}
</style>
</head>

<body>

<div id="game">

    <div class="stars"></div>

    <header class="header">

        <a class="back" href="../index.html">
            <strong>←</strong>
            <span>АРХИВ</span>
        </a>

        <div class="room-name">
            <small>ВТОРОЙ КРУГ</small>
            <b>КОМНАТА СНОВИДЕНИЙ</b>
        </div>

    </header>


    <div class="title">
        <small>МЕСТО, ГДЕ ПАМЯТЬ ТЕРЯЕТ ГРАНИЦЫ</small>
        <h1>Комната Сновидений</h1>
    </div>


    <main class="center">

        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>


        <!-- ЛУНА -->

        <button
            class="moon"
            id="moon"
            aria-label="Луна"
        >
            <span class="moon-symbol">☽</span>
        </button>


        <!-- СИМВОЛЫ -->

        <button
            class="sign"
            data-message="Сон начинается тогда, когда ты перестаёшь считать невозможное невозможным."
        >
            <span>◇</span>
            <small>ПАМЯТЬ</small>
        </button>


        <button
            class="sign"
            data-message="Не пытайся управлять сновидением. Сначала научись замечать его."
        >
            <span>◈</span>
            <small>ВНИМАНИЕ</small>
        </button>


        <button
            class="sign"
            data-message="Иногда сон оставляет после себя не образ, а вопрос."
        >
            <span>✦</span>
            <small>ВОПРОС</small>
        </button>


        <!-- СООБЩЕНИЕ -->

        <div
            class="message"
            id="message"
        >
            <p id="messageText"></p>
            <small>ГОЛОС КОМНАТЫ</small>
        </div>


        <!-- СНОВИДЕЦ -->

        <div class="dreamer">

            <div class="dreamer-aura"></div>

            <div class="dreamer-head"></div>

            <div class="dreamer-body"></div>

            <div class="dreamer-rune">◈</div>

        </div>

    </main>


    <!-- ФРАГМЕНТЫ -->

    <div class="fragments">

        <small>ФРАГМЕНТЫ СНА</small>

        <div
            class="fragment-count"
            id="fragmentCount"
        >
            0 / 3
        </div>

    </div>


    <!-- ЖУРНАЛ -->

    <div class="journal">

        <small>ЖУРНАЛ СНОВИДЦА</small>

        <h3>След первого сна</h3>

        <p id="journalText">
            Комната ещё не знает тебя.
            Исследуй её.
        </p>

        <div class="journal-progress">
            <span id="journalProgress"></span>
        </div>

    </div>


    <button
        class="discovery"
        id="discovery"
    >
        НАЧАТЬ ИССЛЕДОВАНИЕ
    </button>


    <!-- МОДАЛЬНОЕ ОКНО -->

    <div
        class="modal"
        id="modal"
    >

        <div class="modal-card">

            <button
                class="modal-close"
                id="modalClose"
            >
                ×
            </button>

            <div class="modal-kicker">
                ФРАГМЕНТ ЗНАНИЯ
            </div>

            <h2 id="modalTitle">
                Первый фрагмент
            </h2>

            <p id="modalText"></p>

            <button
                class="modal-button"
                id="saveFragment"
            >
                СОХРАНИТЬ ФРАГМЕНТ
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   СОСТОЯНИЕ
========================================================= */

const KEY =
    "dreaming_room_state";

let state =
    JSON.parse(
        localStorage.getItem(KEY) ||
        '{"fragments":[],"visited":false}'
    );


const fragments = [

    {
        id:"first",

        title:"Первый порог",

        text:
        "Ты не вошёл в сон. Ты заметил, что уже находишься внутри него. Это различие кажется маленьким, но именно с него начинается исследование."
    },

    {
        id:"attention",

        title:"Внимание во сне",

        text:
        "Во сне привычный порядок вещей становится менее устойчивым. Вместо того чтобы искать объяснение, попробуй сначала удержать внимание на самом факте происходящего."
    },

    {
        id:"question",

        title:"Вопрос",

        text:
        "Иногда вопрос ценнее ответа. Когда привычная картина мира перестаёт быть единственной возможной картиной, возникает пространство для нового знания."
    }

];


/* =========================================================
   ELEMENTS
========================================================= */

const message =
    document.getElementById("message");

const messageText =
    document.getElementById("messageText");

const fragmentCount =
    document.getElementById("fragmentCount");

const journalText =
    document.getElementById("journalText");

const journalProgress =
    document.getElementById("journalProgress");

const modal =
    document.getElementById("modal");

const modalTitle =
    document.getElementById("modalTitle");

const modalText =
    document.getElementById("modalText");

let currentFragment = null;


/* =========================================================
   SAVE
========================================================= */

function save(){

    localStorage.setItem(
        KEY,
        JSON.stringify(state)
    );

}


/* =========================================================
   MESSAGE
========================================================= */

let messageTimer;

function say(text){

    messageText.textContent =
        text;

    message.classList.add("show");

    clearTimeout(messageTimer);

    messageTimer =
        setTimeout(
            ()=>{
                message.classList.remove("show");
            },
            5000
        );

}


/* =========================================================
   FRAGMENTS
========================================================= */

function updateFragments(){

    const count =
        state.fragments.length;

    fragmentCount.textContent =
        `${count} / ${fragments.length}`;

    journalProgress.style.width =
        `${(count / fragments.length) * 100}%`;


    if(count === 0){

        journalText.textContent =
            "Комната ещё не знает тебя. Исследуй её.";

    }

    else if(count === 1){

        journalText.textContent =
            "Первый след найден. Пространство начинает реагировать.";

    }

    else if(count === 2){

        journalText.textContent =
            "Ты заметил закономерность. Остался последний фрагмент.";

    }

    else{

        journalText.textContent =
            "Комната открыла тебе первый секрет. Но это только начало.";

    }

}


/* =========================================================
   OPEN FRAGMENT
========================================================= */

function openFragment(fragment){

    currentFragment =
        fragment;

    modalTitle.textContent =
        fragment.title;

    modalText.textContent =
        fragment.text;

    modal.classList.add("open");

}


/* =========================================================
   SAVE FRAGMENT
========================================================= */

document
    .getElementById("saveFragment")
    .addEventListener(
        "click",
        ()=>{

            if(!currentFragment)
                return;


            if(
                !state.fragments.includes(
                    currentFragment.id
                )
            ){

                state.fragments.push(
                    currentFragment.id
                );

                save();

                updateFragments();

                say(
                    "Фрагмент сохранён. Комната запомнила тебя."
                );

            }
            else{

                say(
                    "Этот фрагмент уже находится в твоём журнале."
                );

            }


            modal.classList.remove(
                "open"
            );

        }
    );


/* =========================================================
   CLOSE MODAL
========================================================= */

document
    .getElementById("modalClose")
    .addEventListener(
        "click",
        ()=>{
            modal.classList.remove("open");
        }
    );


modal.addEventListener(
    "click",
    e=>{

        if(e.target === modal){

            modal.classList.remove("open");

        }

    }
);


/* =========================================================
   СИМВОЛЫ
========================================================= */

document
    .querySelectorAll(".sign")
    .forEach(sign=>{

        sign.addEventListener(
            "click",
            ()=>{

                say(
                    sign.dataset.message
                );

            }
        );

    });


/* =========================================================
   ЛУНА
========================================================= */

document
    .getElementById("moon")
    .addEventListener(
        "click",
        ()=>{

            const available =
                fragments.filter(
                    fragment =>
                        !state.fragments.includes(
                            fragment.id
                        )
                );


            if(available.length){

                const fragment =
                    available[0];

                openFragment(
                    fragment
                );

                return;

            }


            say(
                "Луна молчит. Ты уже собрал всё, что она могла показать."
            );

        }
    );


/* =========================================================
   НАЧАТЬ ИССЛЕДОВАНИЕ
========================================================= */

document
    .getElementById("discovery")
    .addEventListener(
        "click",
        ()=>{

            state.visited =
                true;

            save();


            say(
                "Закрой глаза. Теперь открой их внутри сна."
            );


            document
                .getElementById("discovery")
                .textContent =
                "КОМНАТА ОТКРЫТА";


            setTimeout(
                ()=>{

                    if(
                        !state.fragments.includes("first")
                    ){

                        openFragment(
                            fragments[0]
                        );

                    }

                },
                1300
            );

        }
    );


/* =========================================================
   КЛАВИАТУРА
========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        if(e.key === "Escape"){

            modal.classList.remove(
                "open"
            );

        }

        if(e.key.toLowerCase() === "e"){

            document
                .getElementById("moon")
                .click();

        }

    }
);


/* =========================================================
   ИНИЦИАЛИЗАЦИЯ
========================================================= */

updateFragments();

if(state.visited){

    document
        .getElementById("discovery")
        .textContent =
        "ПРОДОЛЖИТЬ ИССЛЕДОВАНИЕ";

}

</script>

</body>
</html>
